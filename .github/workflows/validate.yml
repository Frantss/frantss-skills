name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install validation tools
        run: |
          gh release download v2.101.0 --repo cli/cli --pattern 'gh_2.101.0_linux_amd64.tar.gz' --dir "$RUNNER_TEMP/gh-cli"
          tar -xzf "$RUNNER_TEMP/gh-cli/gh_2.101.0_linux_amd64.tar.gz" -C "$RUNNER_TEMP/gh-cli"
          echo "$RUNNER_TEMP/gh-cli/gh_2.101.0_linux_amd64/bin" >> "$GITHUB_PATH"
          npm install --global @anthropic-ai/claude-code@2.1.291
      - run: make test
      - run: make validate
